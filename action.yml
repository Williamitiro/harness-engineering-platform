name: Harness docs-check
description: >-
  Confere a organização de documentos do repositório (HE-DOC-02, SPEC §11): lugar, orçamento e índice,
  contra .harness/docs-policy.json. Sem política, não faz nada. Só Python stdlib, sem rede.
inputs:
  base:
    description: Ref ou SHA de comparação (merge-base com o HEAD). Padrão, o SHA base do PR.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: docs-check
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
      run: |
        args=(check --repo .)
        if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
          # The default actions/checkout is shallow (depth 1): merge-base needs the history of both sides.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --quiet --unshallow origin
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$BASE"
          args+=(--base "$BASE")
        fi
        python3 "$GITHUB_ACTION_PATH/scripts/docs_gate.py" "${args[@]}"
