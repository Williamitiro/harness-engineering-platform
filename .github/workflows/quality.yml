name: Harness Foundation - stdlib checks

on:
  pull_request:
  push:
    branches: [main, "codex/**", "claude/**"]
  workflow_dispatch:
    inputs:
      legacy_mcp:
        description: "Também rodar a integração do pacote npm legado jev-code (baixa do npm, sem API paga)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Actions fixadas por SHA de commit (a tag fica no comentário); o Dependabot propõe as atualizações.
jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # O operador usa Windows (junctions, CRLF, caminhos longos); o Linux é a referência do CI.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile tools and tests
        run: python -m compileall -q scripts tests benchmarks
      - name: Offline isolated unit tests (no external package downloads)
        env:
          JEV_REAL_INTEGRATION: "0"
          PYTHONUTF8: "1"
        run: python -W error -m unittest discover -s tests -v

  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit historical CSV arithmetic without changing evidence
        run: |
          python scripts/audit_legacy.py docs/evidence/HE_AG_001_RESULTADOS.csv --expected-input 419019 > /tmp/legacy-audit.json
          python -c 'import json; x=json.load(open("/tmp/legacy-audit.json")); assert x["run_count"] == 9; assert x["aggregates"]["input_tokens"] == 438919; assert x["aggregates"]["total_tokens"] == 467124; assert x["by_condition"]["C"]["skills_executed"] == 0'
      - name: Evaluate synthetic Jev fixture offline without API calls
        run: |
          python scripts/jev_offline_eval.py --input benchmarks/jev/fixtures_example.jsonl --policy config/jev_pilot_policy.json > /tmp/jev-offline.json
          python -c 'import json; x=json.load(open("/tmp/jev-offline.json")); assert x["status"] == "OFFLINE_SCORE_ONLY_NOT_MODEL_PROOF"; assert x["count"] == 5; assert x["accepted"] == 2; assert x["wrong_high_confidence_ids"] == []'
      - name: Refuse empirical claims from synthetic comparison fixtures
        run: |
          python scripts/jev_offline_eval.py --input benchmarks/jev/fixtures_pilot.jsonl --policy config/jev_multi_domain_policy.json --compare > /tmp/jev-comparison.json
          python -c 'import json; x=json.load(open("/tmp/jev-comparison.json")); assert x["status"] == "SYNTHETIC_FIXTURE_ARITHMETIC_ONLY"; assert x["recommendation"] == "NO_EMPIRICAL_EVIDENCE_FOR_ADOPTION"; assert not x["provenance"]["jev_model_called"]; assert not x["provenance"]["runtime_metrics_observed"]'
      - name: Verify collector simulation mode and independent evaluator offline
        run: |
          python scripts/jev_collector.py --tasks benchmarks/jev/tasks/tasks_skills.jsonl --condition CONDITION_J_ADVISORY --mode simulation --output /tmp/run_sim_j.jsonl
          python scripts/jev_evaluator.py --run /tmp/run_sim_j.jsonl --ground-truth benchmarks/jev/ground_truth/golden_skills.jsonl --policy config/jev_pilot_policy.json > /tmp/eval_sim_j.json
          python -c 'import json; x=json.load(open("/tmp/eval_sim_j.json")); assert x["evidence_level"] == "SYNTHETIC_SIMULATION_ONLY"; assert not x["model_quality_proven"]; assert x["recommendation"] == "NO_EMPIRICAL_EVIDENCE_FOR_ADOPTION"'
      - name: Ensure dry-run evaluation succeeds offline
        run: python scripts/harness_eval.py --client codex --condition A --dry-run
      - name: Ensure no live runtime LLM benchmark was executed in CI
        run: echo "CI validates tool code, offline dry-run and historic CSV arithmetic only. Live runtime LLM = NOT_RUN in CI."

  # jev-code (MCP/Node) é legado (SPEC §7): baixar o pacote do npm em todo PR não traz prova nova.
  legacy-mcp-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_mcp
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Real upstream MCP protocol integration (no paid API)
        env:
          JEV_REAL_INTEGRATION: "1"
          TYPESAFE_API_KEY: ""
        run: python -m unittest discover -s tests -p test_jev_real_package.py -v
